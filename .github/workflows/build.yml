name: Build

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libasound2-dev \
            libdbus-1-dev \
            libclang-dev \
            linux-libc-dev \
            libv4l-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libexpat1-dev \
            zlib1g-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: linux-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Build
        working-directory: rust
        run: cargo build --release --frozen
        env:
          # Required by nokhwa's V4L2 bindgen on Linux
          LIBCLANG_PATH: /usr/lib/llvm-18/lib

      - name: Package
        run: |
          mkdir -p dist
          cp rust/target/release/lbh dist/lbh
          tar -czf dist/lbh-linux-x86_64.tar.gz -C dist lbh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lbh-linux-x86_64
          path: dist/lbh-linux-x86_64.tar.gz

  build-macos:
    runs-on: macos-14  # Apple Silicon (M1)
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: brew install pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: macos-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Build
        working-directory: rust
        run: cargo build --release --frozen

      - name: Package
        run: |
          mkdir -p dist
          cp rust/target/release/lbh dist/lbh
          tar -czf dist/lbh-macos-aarch64.tar.gz -C dist lbh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lbh-macos-aarch64
          path: dist/lbh-macos-aarch64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lbh-linux-x86_64/lbh-linux-x86_64.tar.gz
            dist/lbh-macos-aarch64/lbh-macos-aarch64.tar.gz
          generate_release_notes: true
