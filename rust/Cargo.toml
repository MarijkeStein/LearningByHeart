[package]
name = "lbh"
version = "0.3.0"
edition = "2024"

[dependencies]
slint = "1.17.1"
nokhwa = { version = "0.10.11", features = ["input-native"] }
cpal = "0.18.2"
hound = "3.5.1"
chrono = "0.4.45"
btleplug = "0.13.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
futures = "0.3"
uuid = "1"

[build-dependencies]
slint-build = "1.17.1"
